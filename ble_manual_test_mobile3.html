<!--
ble_manual_test_mobile3.html — Android/Chrome mobile equivalent of ble_manual_test3.py
(v3 — adds a home screen with two big tiles, "One device" and "Loop devices",
under the battery widget. The battery/header stay put across screens; nothing
sent/received is shown until you open a tile. "Loop devices" holds the
get/run/stop commands and a filtered live log (USB/battery lines are omitted
there — the battery widget already shows that). "One device" currently only
holds "change addr" — a stub for now, more single-device controls TBD.)

Same behavior as the Python script:
  - Scans/connects to "PROG7000" (service FFF0), subscribes to notifications
    on FFF1, and prints whatever the device sends.
  - Sends nothing on its own except an optional keepalive. You type a line and
    press Send (or Enter) — that text is hex-ASCII-encoded (2 hex chars per
    byte) before being written, because the firmware's FFF1 parser
    (convert_ascii_to_hex in ble.c) requires that encoding on the wire.
  - Keepalive: every 3s writes "Hello prog7000" (same hex-encoding, Write
    Without Response) so you notice a dead link within one interval instead
    of only when you next type something. Pause/Resume button toggles it
    without disconnecting — handy for watching the firmware's own 10s
    BLE-watchdog fire on purpose (main.c:501).

Requirements:
  - Chrome (or another Chromium browser) on Android. Web Bluetooth does NOT
    work in Safari/iOS — there is no iOS equivalent of this file.
  - A "secure context": either serve this file over HTTPS, or use the
    adb-reverse trick below to make it load as http://localhost on the phone
    (Chrome treats localhost as secure even over plain HTTP).

Quick way to run it (no certificates needed):
  1. On the PC, in the folder containing this file:
       python -m http.server 8000
  2. Connect the phone via USB with USB debugging on, then on the PC:
       adb reverse tcp:8000 tcp:8000
  3. On the phone, open Chrome and go to:
       http://localhost:8000/ble_manual_test_mobile.html
  4. Tap "Connect", pick "PROG7000" from the browser's device picker.

(A plain http:// page served from the PC's LAN IP, e.g. http://192.168.x.x:8000/...,
will NOT work — Web Bluetooth refuses insecure origins other than localhost.)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prog7000 Test - Mobile</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1f27;
    --border: #2c313c;
    --text: #e6e8ec;
    --muted: #8a90a0;
    --accent: #4da6ff;
    --ok: #3ecf6f;
    --err: #ff5f56;
    --warn: #ffb84d;
    --ansi-blue: #4da6ff;
    --ansi-cyan: #4dd0e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh;   /* fallback for browsers without dvh */
    height: 100dvh;  /* actual visible viewport on mobile Chrome — accounts for the address bar,
                         so the footer (input box) is never pushed off-screen below the fold */
    overflow: hidden; /* nothing here scrolls anymore — no live log, everything is a fixed-position field that updates in place */
  }
  header {
    flex: 0 0 auto; /* never shrink */
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; flex: 1 1 auto; font-weight: 600; }
  #status { font-size: 13px; padding: 3px 9px; border-radius: 12px; background: #2a2e37; color: var(--muted); }
  #status.connected { background: rgba(62,207,111,0.15); color: var(--ok); }
  #status.error { background: rgba(255,95,86,0.15); color: var(--err); }
  button {
    font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #262b35; color: var(--text); cursor: pointer;
  }
  button:active { background: #2f3542; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #06131f; border-color: var(--accent); font-weight: 600; }
  #battRow {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  #battTextWrap { display: flex; flex-direction: column; gap: 2px; }
  #battText { font-size: 22px; font-weight: 600; color: var(--text); }
  #battChargeText { font-size: 15px; font-weight: 600; color: var(--warn); }
  #battFill { transition: y 0.6s ease, height 0.6s ease, fill 0.4s ease; }
  #battBolt { animation: battPulse 1.4s ease-in-out infinite; }
  @keyframes battPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .quickCmdsRow {
    flex: 0 0 auto; /* never shrink */
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    /* overflow-y must be set explicitly to "visible" here — leaving it unset
       while overflow-x is "auto" makes the browser silently force overflow-y
       to "auto" too (per the CSS overflow spec), turning this row into its
       own vertical scroll/clip box and cropping the buttons. */
    overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch;
  }
  .quickCmdsRow button {
    flex: 0 0 auto; font-size: 14px; font-weight: 600; padding: 10px 16px; line-height: 1.2;
    border-radius: 20px; white-space: nowrap;
    background: rgba(77,166,255,0.15); border: 1.5px solid var(--accent); color: var(--accent);
  }
  .quickCmdsRow button:active { background: rgba(77,166,255,0.3); }
  .quickCmdsRow button:disabled { background: transparent; border-color: var(--border); color: var(--muted); opacity: 1; }
  #homeView {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; align-content: start;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px;
  }
  #loopView, #oneView, #logView, #commandView {
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  #rawLog {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 10px 12px; font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .logLine { margin: 0 0 2px 0; }
  .logLine.tx { color: var(--accent); }
  .logLine.rx { color: var(--text); }
  .logLine.sys { color: var(--muted); }
  .logLine.err { color: var(--err); }
  .logLine.warn { color: var(--warn); }
  .tileBtn {
    aspect-ratio: 1 / 1; border-radius: 16px; border: 1.5px solid var(--accent);
    background: rgba(77,166,255,0.1); color: var(--text); font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px;
  }
  .tileBtn:active { background: rgba(77,166,255,0.25); }
  .tileBtn:disabled { opacity: 0.4; border-color: var(--border); background: transparent; }
  .viewHeader {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .viewHeader h2 { font-size: 15px; margin: 0; font-weight: 600; flex: 1 1 auto; }
  #oneDeviceInfo { padding: 16px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; }
  #oneTextCol { display: flex; flex-direction: column; gap: 12px; }
  #oneDeviceIconWrap { flex: 0 0 auto; margin-right: 24px; }
  #oneAddrLine, #oneValueLine, #oneVersionLine, #oneTempLine { font-size: 22px; font-weight: 600; color: var(--text); }
  #slcInfo, #v24Info {
    flex: 0 0 auto; padding: 6px 16px; display: flex; flex-direction: column; gap: 2px;
    background: var(--panel);
  }
  #v24Info { border-bottom: 1px solid var(--border); }
  #slcStatusLine, #slcVoltsAmpsLine, #v24StatusLine, #v24VoltsAmpsLine {
    font-size: 20px; font-weight: 600; color: var(--text);
  }
  #loopSpacer {
    flex: 1 1 auto; min-height: 0; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  }
  #loopAddrLine, #loopValueLine, #loopTransmitLine, #loopRecErrorLine { flex: 0 0 auto; font-size: 22px; font-weight: 600; color: var(--text); }
  #loopFoundInfo {
    max-height: 35vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 4px;
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  /* Part of the scrollable content itself (not a separate overlaid div) —
     sticks to the bottom of the visible scroll area as you scroll, without
     an extra wrapper element that could interfere with touch-scroll hit
     testing on the actual list. */
  #loopFoundMoreHint {
    display: none; position: sticky; bottom: 0; order: 9999;
    text-align: center; font-size: 12px; font-weight: 700; color: var(--muted);
    background: var(--bg); border-radius: 10px; padding: 3px 0; margin-top: 2px;
  }
  footer {
    flex: 0 0 auto; /* never shrink */
    display: flex; gap: 8px; padding: 10px 12px; background: var(--panel);
    border-top: 1px solid var(--border); align-items: center;
  }
  #cmd {
    flex: 1 1 auto; font-size: 15px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #12151b; color: var(--text);
  }
  #keepaliveBtn.paused { color: var(--warn); border-color: var(--warn); }
</style>
</head>
<body>

<header>
  <h1>Prog7000 Test - Mobile</h1>
  <span id="status">disconnected</span>
  <button id="connectBtn" class="primary">Connect</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <button id="keepaliveBtn" disabled>Keepalive: on</button>
  <button id="logBtn">Log</button>
</header>

<div id="battRow" style="display:none" title="Waiting for a battery status report...">
  <svg id="battSvg" viewBox="0 0 54 128" width="38" height="90">

    <rect x="2" y="8" width="50" height="118" rx="10" fill="none" stroke="var(--muted)" stroke-width="7"/>
    <rect id="battFill" x="8" y="120" width="38" height="0" rx="6" fill="var(--muted)"/>

  <div id="oneDeviceInfo">
    <div id="oneTextCol">
      <div id="oneAddrLine">Address = —</div>
      <div id="oneValueLine">Value = —</div>
      <div id="oneVersionLine">Version = —</div>
      <div id="oneTempLine">Temp = —</div>
    </div>

      <svg id="oneDeviceIcon" viewBox="0 0 93 48" width="93" height="48">
        <rect x="0" y="0" width="93" height="48" fill="#161616"/>
        <path d="M3,3 L90,3 L90,13.5 L83.2,24 L9.8,24 L3,13.5 Z" fill="none" stroke="#fdf6e3" stroke-width="2.2"/>
        <text x="46.5" y="18.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="0.3" fill="#fdf6e3">PHOTO</text>
        <path d="M18,24 L75,24 L75,35 L73,38 L20,38 L18,35 Z" fill="none" stroke="#fdf6e3" stroke-width="1.8"/>
        <g fill="#fdf6e3">
          <rect x="21" y="28" width="3" height="7"/>
          <rect x="27" y="28" width="3" height="7"/>
          <rect x="33" y="28" width="3" height="7"/>
          <rect x="39" y="28" width="3" height="7"/>
          <rect x="45" y="28" width="3" height="7"/>
          <rect x="51" y="28" width="3" height="7"/>
          <rect x="57" y="28" width="3" height="7"/>
          <rect x="63" y="28" width="3" height="7"/>
          <rect x="69" y="28" width="3" height="7"/>
        </g>
        <path d="M58,38 L67,38 L62.5,44 Z" fill="#fdf6e3"/>

</div>

<div id="logView" style="display:none">
  <div class="viewHeader">

    <button id="clearLogBtn">Clear</button>
  </div>
  <div id="rawLog"></div>
</div>

<div id="commandView" style="display:none">
  <div class="viewHeader">
    <button id="backFromCommand">&larr; Back</button>
    <h2>Command</h2>
  </div>
  <div class="quickCmdsRow">
    <button id="ledOnBtn" class="quickCmdBtn">Led ON</button>
    <button id="ledOffBtn" class="quickCmdBtn">Led OFF</button>

</div>

<script>
const DEVICE_NAME_PREFIX = "PROG7000";
const SERVICE_UUID = "0000fff0-0000-1000-8000-00805f9b34fb";
const CHAR_UUID    = "0000fff1-0000-1000-8000-00805f9b34fb";
const KEEPALIVE_TEXT = "Hello prog7000";
const KEEPALIVE_INTERVAL_MS = 3000;

let device = null, server = null, characteristic = null;
let wakeLock = null;

// Keeps the screen from auto-dimming/locking due to idle timeout while
// connected, so mobile Chrome never freezes this tab's timers and the
// keepalive keeps reaching the firmware's 10s BLE-watchdog (main.c:501).
// Note: this only stops the OS's own idle timeout — it cannot stop the
// screen turning off if the power button is pressed deliberately; in that
// case there is no web-page-level fix, the link will drop like before.
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) {
    log("This browser doesn't support Screen Wake Lock — the screen turning off (even just from idle timeout) may still drop the connection.", 'warn');
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    log('[Wake Lock] screen will stay on while connected.', 'sys');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (err) {
    log(`[Wake Lock] request failed: ${err}`, 'warn');
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
let keepaliveTimer = null, keepaliveEnabled = true;

const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const keepaliveBtn = document.getElementById('keepaliveBtn');
const cmdEl = document.getElementById('cmd');
const sendBtn = document.getElementById('sendBtn');
const chAddrBtn = document.getElementById('chAddrBtn');
const homeView = document.getElementById('homeView');
const loopView = document.getElementById('loopView');
const oneView = document.getElementById('oneView');
const tileOneDevice = document.getElementById('tileOneDevice');
const tileLoopDevices = document.getElementById('tileLoopDevices');
const backFromLoop = document.getElementById('backFromLoop');
const backFromOne = document.getElementById('backFromOne');
const logView = document.getElementById('logView');
const logBtn = document.getElementById('logBtn');
const backFromLog = document.getElementById('backFromLog');
const clearLogBtn = document.getElementById('clearLogBtn');
const rawLogEl = document.getElementById('rawLog');
const commandView = document.getElementById('commandView');
const commandBtn = document.getElementById('commandBtn');
const backFromCommand = document.getElementById('backFromCommand');
const ledOnBtn = document.getElementById('ledOnBtn');
const ledOffBtn = document.getElementById('ledOffBtn');
const oneAddrLineEl = document.getElementById('oneAddrLine');
const oneValueLineEl = document.getElementById('oneValueLine');
const oneVersionLineEl = document.getElementById('oneVersionLine');
const oneTempLineEl = document.getElementById('oneTempLine');
const oneDeviceIconWrapEl = document.getElementById('oneDeviceIconWrap');
const slcInfoEl = document.getElementById('slcInfo');
const slcStatusLineEl = document.getElementById('slcStatusLine');
const slcVoltsAmpsLineEl = document.getElementById('slcVoltsAmpsLine');
const v24InfoEl = document.getElementById('v24Info');
const v24StatusLineEl = document.getElementById('v24StatusLine');
const v24VoltsAmpsLineEl = document.getElementById('v24VoltsAmpsLine');
const loopAddrLineEl = document.getElementById('loopAddrLine');
const loopValueLineEl = document.getElementById('loopValueLine');
const loopTransmitLineEl = document.getElementById('loopTransmitLine');
const loopRecErrorLineEl = document.getElementById('loopRecErrorLine');
const loopFoundInfoEl = document.getElementById('loopFoundInfo');
const loopFoundMoreHintEl = document.getElementById('loopFoundMoreHint');

// The hint lives inside the same scrollable box (see CSS `order: 9999`,
// which keeps it visually last regardless of DOM position) so clearing the
// found-devices list must remove only the line divs, never the hint itself.
function clearLoopFoundLines() {
  Array.from(loopFoundInfoEl.children).forEach((child) => {
    if (child !== loopFoundMoreHintEl) child.remove();
  });
}

// Three screens sharing the header/battery widget above them: 'home' (the
// two big tiles, nothing else — no log, no traffic shown), 'loop' (get/run/
// stop + the filtered live log), 'one' (currently just "change addr").
let viewBeforeLog = 'home';

function showView(view) {
  homeView.style.display = (view === 'home') ? '' : 'none';
  loopView.style.display = (view === 'loop') ? '' : 'none';
  oneView.style.display = (view === 'one') ? '' : 'none';
  logView.style.display = (view === 'log') ? '' : 'none';
  commandView.style.display = (view === 'command') ? '' : 'none';
}

// "Log" is reachable from any screen and returns to whichever one you were
// actually on, instead of always dumping you back on the home tiles.
logBtn.addEventListener('click', () => {
  viewBeforeLog = loopView.style.display !== 'none' ? 'loop'
    : oneView.style.display !== 'none' ? 'one'
    : commandView.style.display !== 'none' ? 'command' : 'home';
  showView('log');
});
backFromLog.addEventListener('click', () => showView(viewBeforeLog));
clearLogBtn.addEventListener('click', () => { rawLogEl.innerHTML = ''; });
// Entering "one device" immediately asks the firmware about the currently
// selected device; leaving either sub-screen sends "stop" first, so a
// "run all devices"/"get device" left running doesn't keep going in the
// background just because you navigated away from its screen.
function resetOneView() {
  oneAddrLineEl.textContent = 'Address = —';
  oneAddrLineEl.style.display = '';
  oneValueLineEl.textContent = 'Value = —';
  oneValueLineEl.style.display = '';
  oneVersionLineEl.textContent = 'Version = —';
  oneVersionLineEl.style.display = '';
  oneTempLineEl.textContent = 'Temp = — °C';
  oneTempLineEl.style.display = '';
  oneDeviceIconWrapEl.style.display = '';
}

function resetLoopView() {
  slcInfoEl.style.display = 'none';
  slcStatusLineEl.textContent = 'SLC Status = —';
  slcStatusLineEl.style.color = 'var(--text)';
  lastLineAVolts = null;
  lastHCurrMa = null;
  renderSlcVoltsAmps();
  v24InfoEl.style.display = 'none';
  v24StatusLineEl.textContent = '24V Out Status = —';
  v24StatusLineEl.style.color = 'var(--text)';
  lastV24OutVolts = null;
  lastV24OutCurrentMa = null;
  renderV24VoltsAmps();
  loopAddrLineEl.textContent = 'Address = —';
  loopAddrLineEl.style.display = 'none';
  loopValueLineEl.textContent = 'Value = —';
  loopValueLineEl.style.display = 'none';
  loopTransmitLineEl.textContent = 'Total transmit = —';
  loopTransmitLineEl.style.display = 'none';
  loopRecErrorLineEl.textContent = 'receive error = —';
  loopRecErrorLineEl.style.display = 'none';
  clearLoopFoundLines();
  loopFoundInfoEl.style.display = 'none';
  loopFoundMoreHintEl.style.display = 'none';
  lastSameAddress = null;
  lastLedAddress = null;
}

tileOneDevice.addEventListener('click', () => {
  showView('one');
  resetOneView();
  sendText('get device');
});
tileLoopDevices.addEventListener('click', () => {
  showView('loop');
  resetLoopView();
});
commandBtn.addEventListener('click', () => showView('command'));
backFromCommand.addEventListener('click', () => showView('loop'));

// Priority: whatever address was last actually used for LED ON/OFF (either
// one — so OFF picks up an address you just typed for ON, and vice versa)
// beats the scan's Same Address, which beats the plain default of 1.
let lastLedAddress = null;

function promptForDeviceAddress(message) {
  const defaultVal = (lastLedAddress !== null) ? lastLedAddress
    : (lastSameAddress !== null) ? lastSameAddress : '1';
  const input = window.prompt(message, defaultVal);
  if (input === null) return null; // cancelled

  const trimmed = input.trim();
  if (!/^\d{1,3}$/.test(trimmed)) {
    log(`"${input}" is not 1-3 digits — not sent.`, 'err');
    return null;
  }
  lastChAddr = parseInt(trimmed, 10);
  lastLedAddress = trimmed;
  return trimmed;
}

// LED_ON=2, LED_OFF=3 — service_detector.h. Sent via the same generic
// "addr<N>opc<N>" command CommandParser already understands
// (Prog7000_App.c, WORK_STATE_SEND_COMMANDS) — no repeat count given, so
// it fires once and returns to idle.
ledOnBtn.addEventListener('click', () => {
  const addr = promptForDeviceAddress('Device address for LED ON:');
  if (addr === null) return;
  sendText(`addr${addr}opc2`);
});
ledOffBtn.addEventListener('click', () => {
  const addr = promptForDeviceAddress('Device address for LED OFF:');
  if (addr === null) return;
  sendText(`addr${addr}opc3`);
});

backFromLoop.addEventListener('click', () => {
  sendText('stop');
  showView('home');
});
backFromOne.addEventListener('click', () => {
  sendText('stop');
  showView('home');
});
const battRowEl = document.getElementById('battRow');
const battFillEl = document.getElementById('battFill');
const battBoltEl = document.getElementById('battBolt');
const battTextEl = document.getElementById('battText');
const battChargeTextEl = document.getElementById('battChargeText');

// Remembers the last address actually sent via "change addr", so the next
// prompt is pre-filled with lastChAddr + 1 instead of starting from scratch.
let lastChAddr = null;

// No visible log on screen anymore — every screen only shows fixed-position
// fields (battery, SLC status/Line_A/H_Curr, one-device address/value) that
// update in place as fresh data arrives, never a scrolling transcript. Raw
// traffic is only meant to be watched on the debugger/debug-UART console,
// not here. log() is kept as a thin console.log wrapper — every existing
// call site (connect/disconnect notices, write failures, etc.) still works
// unchanged, it just no longer touches the DOM.
function log(text, cls) {
  console.log(`[${cls || 'sys'}] ${text}`);
  const div = document.createElement('div');
  div.className = 'logLine ' + (cls || 'sys');
  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  div.textContent = `[${ts}] ${text}`;
  rawLogEl.appendChild(div);
  rawLogEl.scrollTop = rawLogEl.scrollHeight;
}

function setConnectedUI(connected) {
  statusEl.textContent = connected ? 'connected' : 'disconnected';
  statusEl.className = connected ? 'connected' : '';
  connectBtn.disabled = connected;
  disconnectBtn.disabled = !connected;
  keepaliveBtn.disabled = !connected;
  // The loop/one screens are only reachable by tapping a tile, and a
  // disconnect always bounces back to the home screen (see onDisconnected),
  // so their own buttons no longer need their own disabled tracking.
  tileOneDevice.disabled = !connected;
  tileLoopDevices.disabled = !connected;
  battRowEl.style.display = connected ? '' : 'none';
}

// ---- ASCII-hex encode/decode (mirrors ble_manual_test3.py) ----

function textToHexAsciiPayload(text) {
  // Drop non-ASCII chars, like Python's .encode('ascii', errors='ignore')
  const asciiOnly = Array.from(text).filter(ch => ch.charCodeAt(0) < 128).join('');
  const bytes = new TextEncoder().encode(asciiOnly);
  let hex = '';
  for (const b of bytes) hex += b.toString(16).padStart(2, '0');
  hex = hex.toUpperCase();
  return { hex, payload: new TextEncoder().encode(hex) };
}

function isHexString(s) {
  return s.length > 0 && s.length % 2 === 0 && /^[0-9A-Fa-f]+$/.test(s);
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) out[i / 2] = parseInt(hex.substr(i, 2), 16);
  return out;
}

function handleNotification(bytes) {
  let asciiStr = '';
  try {
    asciiStr = Array.from(bytes).map(b => String.fromCharCode(b)).join('').trim();
  } catch (e) { /* fall through */ }

  let decoded;
  if (isHexString(asciiStr)) {
    decoded = hexToBytes(asciiStr);
  } else {
    decoded = bytes;
  }

  if (decoded.length === 1) {
    log(`single byte: 0x${decoded[0].toString(16).toUpperCase().padStart(2, '0')}`, 'rx');
    return;
  }

  let text;
  try {
    text = new TextDecoder('utf-8', { fatal: false }).decode(decoded);
  } catch (e) {
    text = Array.from(decoded).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  log(text, 'rx'); // console only now — see log()
  tryParseBattery(text);
  tryParseOneDeviceAnswer(text);
  tryParseSlcInfo(text);
  tryParseV24Info(text);
  tryParseLoopScanInfo(text);
}

// Reuses the same "Receive ADDR=... OPC=... DATA=..." / "tr_com = N" shapes
// as tryParseOneDeviceAnswer() — receive_addr_opc_data() (Prog7000_App.c)
// sends the same format while "get all devices" walks the loop address by
// address. "Found %d devices" (Prog7000_App.c:2071) marks scan completion —
// once it arrives, Address/Value disappear and only the found-count line
// stays. Reset to the "scanning" state happens in the "get all devices"
// button's own click handler, below.
const FOUND_DEVICES_RE = /Found\s+(\d+)\s+devices/;
// The exact device-type labels ble_send_and_debug_print() reports after
// "Found N devices" (Prog7000_App.c:2078-2123) — each only sent if its
// count is non-zero.
const DEVICE_TYPE_LABELS = [
  'Photo Detector', 'Heat Detector', 'Gas Detector', 'Input Module',
  'Switch', 'Power Supply', 'Isolator', 'Output Module', 'Extinguisher',
  'Exting. Control', 'SCM', 'CO & Heat Detector', 'Photo & Heat Detector'
];
const DEVICE_TYPE_LINE_RE = new RegExp(
  '^(' + DEVICE_TYPE_LABELS.map(l => l.replace(/[.&]/g, '\\$&')).join('|') + ')\\s+(\\d+)'
);
// Duplicate-address entries, up to 16 of them (Prog7000_App.c:2130-2138).
const SAME_ADDRESS_RE = /Same Address\s*=\s*(\d+)/;
// Sent every ~7s while "run all devices" is actively looping
// (Prog7000_App.c:3045) — keeps updating for as long as the loop runs, so
// it's parsed independently of the get-all-devices scan-result state above.
const TRANSMIT_RE = /Total transmit\s*=\s*(\d+)\s+receive error\s*=\s*(\d+)/;
// Last duplicate address a scan turned up — the address prompts default to
// this (see promptForDeviceAddress()), since it's usually exactly the
// device you want to go toggle the LED on to find physically.
let lastSameAddress = null;

function appendLoopResultLine(text, color) {
  const div = document.createElement('div');
  div.textContent = text;
  if (color) div.style.color = color;
  loopFoundInfoEl.appendChild(div);
  updateLoopFoundMoreHint();
}

// Mobile Chrome's scrollbar fades out the instant you stop touching the
// list, so there's no lasting visual cue that it's cut off. This shows a
// small "▼ more" hint pinned to the bottom whenever content is actually
// clipped below the visible area, and hides it once scrolled to the end.
function updateLoopFoundMoreHint() {
  const hasMore = loopFoundInfoEl.scrollHeight - loopFoundInfoEl.clientHeight - loopFoundInfoEl.scrollTop > 4;
  // "none" is this element's CSS-rule default (not just an inline override),
  // so clearing back to '' would fall through to that same "none" — has to
  // be set to an explicit visible value instead.
  loopFoundMoreHintEl.style.display = hasMore ? 'block' : 'none';
}
loopFoundInfoEl.addEventListener('scroll', updateLoopFoundMoreHint);

function tryParseLoopScanInfo(text) {
  const trm = TRANSMIT_RE.exec(text);
  if (trm) {
    loopTransmitLineEl.textContent = `Total transmit = ${trm[1]}`;
    loopTransmitLineEl.style.display = '';
    loopRecErrorLineEl.textContent = `receive error = ${trm[2]}`;
    loopRecErrorLineEl.style.display = '';
    return;
  }
  const fm = FOUND_DEVICES_RE.exec(text);
  if (fm) {
    loopAddrLineEl.style.display = 'none';
    loopValueLineEl.style.display = 'none';
    clearLoopFoundLines();
    loopFoundInfoEl.style.display = 'flex';
    appendLoopResultLine(`Found ${fm[1]} devices`);
    return;
  }
  // Once the results panel is showing, the only other lines that can
  // follow (per the firmware's own send order) are the device-type
  // breakdown and duplicate-address entries — keep appending those.
  if (loopFoundInfoEl.style.display !== 'none') {
    const tm = DEVICE_TYPE_LINE_RE.exec(text);
    if (tm) { appendLoopResultLine(`${tm[1]}  ${tm[2]}`); return; }
    const sm2 = SAME_ADDRESS_RE.exec(text);
    if (sm2) {
      lastSameAddress = sm2[1];
      appendLoopResultLine(`Same Address = ${sm2[1]}`, 'var(--err)');
      return;
    }
  }
  if (TR_COM_RE.test(text)) {
    loopAddrLineEl.textContent = 'Address = Not Connected';
    loopAddrLineEl.style.display = '';
    loopValueLineEl.style.display = 'none';
    return;
  }
  const dm = DEVICE_ANS_RE.exec(text);
  if (dm) {
    loopAddrLineEl.textContent = `Address = ${dm[1]}`;
    loopAddrLineEl.style.display = '';
    loopValueLineEl.textContent = `Value = ${dm[3]}`;
    loopValueLineEl.style.display = '';
  }
}

// From ble_send_and_debug_print() / Prog7000_App.c:2963-2987 — the
// periodic status report's SLC block:
//   "*****  SLC Status - OK  *****" (ANSI-colored; also "CURRENT LIMIT",
//   "Loop Not Closed", "Loop Not Closed(-)")
//   "Line_A=21.74V(1855)   Line_Bp=0.35V(030)  Line_Bm=0.27V(023)"
//   "H_Curr=27.73mA (628)"
const SLC_STATUS_RE = /SLC Status\s*-\s*([A-Za-z0-9() +-]+?)\s*\*/;
const LINE_A_RE = /Line_A\s*=\s*([\d.]+)V/;
const H_CURR_RE = /H_Curr\s*=\s*([\d.]+)mA/;

function slcStatusColor(status) {
  if (/current limit/i.test(status)) return 'var(--err)';
  if (/loop not closed/i.test(status)) return 'var(--warn)';
  if (/ok/i.test(status)) return 'var(--ok)';
  return 'var(--text)';
}

let lastLineAVolts = null, lastHCurrMa = null;

function renderSlcVoltsAmps() {
  const voltsStr = (lastLineAVolts === null) ? '—' : `${lastLineAVolts}V`;
  const ampsStr = (lastHCurrMa === null) ? '—' : `${lastHCurrMa}mA`;
  slcVoltsAmpsLineEl.textContent = `${voltsStr} · ${ampsStr}`;
}

function tryParseSlcInfo(text) {
  const sm = SLC_STATUS_RE.exec(text);
  if (sm) {
    slcInfoEl.style.display = '';
    slcStatusLineEl.textContent = `SLC Status = ${sm[1]}`;
    slcStatusLineEl.style.color = slcStatusColor(sm[1]);
  }
  const lm = LINE_A_RE.exec(text);
  if (lm) {
    slcInfoEl.style.display = '';
    lastLineAVolts = lm[1];
    renderSlcVoltsAmps();
  }
  const hm = H_CURR_RE.exec(text);
  if (hm) {
    slcInfoEl.style.display = '';
    lastHCurrMa = hm[1];
    renderSlcVoltsAmps();
  }
}

// From ble_send_and_debug_print() / Prog7000_App.c:2934-2952 — the
// periodic status report's 24V-out block:
//   "*****  24V OUT Status - OK  *****" (ANSI-colored; also "CURRENT LIMIT")
//   "V24int=23.16V(1976)    V24R_out=23.14V(1974)    V24_Out=22.93V(1956)"
//   "V24_Out_Current=63.00mA(021)"
const V24_STATUS_RE = /24V OUT Status\s*-\s*([A-Za-z0-9() +-]+?)\s*\*/;
const V24_OUT_RE = /V24_Out=([\d.]+)V/;
const V24_CURRENT_RE = /V24_Out_Current=([\d.]+)mA/;
let lastV24OutVolts = null, lastV24OutCurrentMa = null;

function v24StatusColor(status) {
  if (/current limit/i.test(status)) return 'var(--err)';
  if (/ok/i.test(status)) return 'var(--ok)';
  return 'var(--text)';
}

function renderV24VoltsAmps() {
  const voltsStr = (lastV24OutVolts === null) ? '—' : `${lastV24OutVolts}V`;
  const ampsStr = (lastV24OutCurrentMa === null) ? '—' : `${lastV24OutCurrentMa}mA`;
  v24VoltsAmpsLineEl.textContent = `${voltsStr} · ${ampsStr}`;
}

function tryParseV24Info(text) {
  const sm = V24_STATUS_RE.exec(text);
  if (sm) {
    v24InfoEl.style.display = '';
    v24StatusLineEl.textContent = `24V Out Status = ${sm[1]}`;
    v24StatusLineEl.style.color = v24StatusColor(sm[1]);
  }
  const om = V24_OUT_RE.exec(text);
  if (om) {
    v24InfoEl.style.display = '';
    lastV24OutVolts = om[1];
    renderV24VoltsAmps();
  }
  const cm = V24_CURRENT_RE.exec(text);
  if (cm) {
    v24InfoEl.style.display = '';
    lastV24OutCurrentMa = cm[1];
    renderV24VoltsAmps();
  }
}

// From receive_addr_opc_data() / Prog7000_App.c:1252,1261,1273 — a "get
// device" reply is either "Receive  ADDR=5 OPC=2  DATA=123" (or DATA1=...
// for the 4-byte form) or, if the addressed device didn't answer,
// "tr_com = 1 " / "tr_com = 2 ". Still used as-is by the Loop view's own
// "get device" echo, below — the One Device screen has since moved to the
// richer line right after it.
const DEVICE_ANS_RE = /ADDR=(\d+)\s+OPC=(\d+)\s+DATA1?=(\d+)/;
const TR_COM_RE = /tr_com\s*=\s*(\d+)/;

// One Device screen's own summary line (Prog7000_App.c:1287) — sent right
// after the raw ADDR=/OPC=/DATA= line above, once per "get device"/"get
// version"/"get temperature"/"get type" reply. All 5 fields, including
// Address and Value, are read from here now.
const ONE_DEVICE_RE = /One Device Addr=(\d+)\s+Value=(\d+)\s+Version=(\d+)\s+Temp=(\d+)\s+Type=(\d+)/;

// TODO: once more device-type icons are traced from the real LCD, pick one
// per Type here (mirrors the classification switch in Prog7000_App.c
// ~line 2026, CODE_PHOTOELECTRIC=4 etc.). For now the Photo Detector icon
// is the only artwork that exists, so it's shown for every type.

function tryParseOneDeviceAnswer(text) {
  if (TR_COM_RE.test(text)) {
    oneAddrLineEl.textContent = 'Address = Not Connected';
    oneValueLineEl.style.display = 'none';
    oneVersionLineEl.style.display = 'none';
    oneTempLineEl.style.display = 'none';
    oneDeviceIconWrapEl.style.display = 'none';
    return;
  }
  const dm = ONE_DEVICE_RE.exec(text);
  if (dm) {
    oneAddrLineEl.textContent = `Address = ${dm[1]}`;
    oneValueLineEl.textContent = `Value = ${dm[2]}`;
    oneValueLineEl.style.display = '';
    oneVersionLineEl.textContent = `Version = ${dm[3]}`;
    oneVersionLineEl.style.display = '';
    oneTempLineEl.textContent = `Temp = ${dm[4]}°C`;
    oneTempLineEl.style.display = '';
    oneDeviceIconWrapEl.style.display = '';
  }
}

// Fished out of the firmware's own periodic status report
// (ble_send_and_debug_print() in Prog7000_App.c), e.g.:
//   "Vbat = 4.11 V  (2775)   100%"
//   "*****  BATTERY Status - FULL Charging  *****" (ANSI-colored)
// The two lines arrive as separate BLE notifications, so state is kept
// across calls and the battery widget is redrawn after either one lands.
// Percent is now a float, e.g. "87.3%" (Prog7000_App.c:3093, "%2.1f%%").
const VBAT_RE = /Vbat\s*=\s*([\d.]+)\s*V.*?([\d.]+)\s*%/;
// Same USB-present threshold the firmware itself uses (USB_LOW_VOLTAGE =
// 3.5*USB_VOLT1, Prog7000_App.c:2391) — below it usb_state is ST_CUT
// (no USB), above it the module considers USB actually connected.
const USB_RE = /5V_USB\s*=\s*([\d.]+)\s*V/;
const USB_CONNECTED_THRESHOLD_V = 3.5;
let battPercent = null, battVoltage = null, usbConnected = false;

function tryParseBattery(text) {
  const vm = VBAT_RE.exec(text);
  if (vm) {
    battVoltage = parseFloat(vm[1]);
    battPercent = Math.max(0, Math.min(100, parseFloat(vm[2])));
  }
  const um = USB_RE.exec(text);
  if (um) {
    usbConnected = parseFloat(um[1]) > USB_CONNECTED_THRESHOLD_V;
  }
  if (vm || um) updateBatteryWidget();
}

function updateBatteryWidget() {
  const FILL_MAX_H = 106, FILL_BOTTOM_Y = 120;
  if (battPercent === null) return;
  const h = (battPercent / 100) * FILL_MAX_H;
  battFillEl.setAttribute('height', h.toFixed(1));
  battFillEl.setAttribute('y', (FILL_BOTTOM_Y - h).toFixed(1));
  const color = battPercent <= 20 ? 'var(--err)' : battPercent <= 50 ? 'var(--warn)' : 'var(--ok)';
  battFillEl.setAttribute('fill', color);
  battBoltEl.style.display = usbConnected ? '' : 'none';
  const voltStr = (battVoltage === null) ? '' : ` · ${battVoltage.toFixed(2)}V`;
  battTextEl.textContent = `${battPercent.toFixed(1)}%${voltStr}`;
  battChargeTextEl.style.display = usbConnected ? '' : 'none';
  battRowEl.title = usbConnected ? 'USB connected' : 'USB not connected';
}

// ---- Connect / disconnect ----

async function connect() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth is not available in this browser (need Chrome on Android).', 'err');
    return;
  }
  writeChain = Promise.resolve(); // fresh write queue for this connection
  try {
    log(`Requesting device "${DEVICE_NAME_PREFIX}"...`, 'sys');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: DEVICE_NAME_PREFIX }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);

    log(`Connecting to ${device.name || device.id}...`, 'sys');
    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', (event) => {
      handleNotification(new Uint8Array(event.target.value.buffer));
    });

    log('Connected.', 'sys');
    setConnectedUI(true);
    startKeepalive();
    acquireWakeLock();
  } catch (err) {
    log(`Connect failed: ${err}`, 'err');
    setConnectedUI(false);
  }
}

function onDisconnected() {
  log('Disconnected.', 'sys');
  stopKeepaliveTimer();
  releaseWakeLock();
  characteristic = null;
  server = null;
  setConnectedUI(false);
  showView('home');
}

function disconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect(); // triggers onDisconnected via the event listener
  } else {
    onDisconnected();
  }
}

// ---- Send ----

// Web Bluetooth refuses a second GATT operation while one is still in
// flight — it throws "GATT operation already in progress" instead of
// queueing it. The keepalive timer (every 3s) and manual sends (button/
// quick-command) both write to the same characteristic independently, so
// without this queue they could collide and the keepalive write would
// spuriously fail right when you send a command (or vice versa). Every
// write below is chained onto this promise instead of firing directly,
// so the actual GATT call always waits for the previous one to finish.
let writeChain = Promise.resolve();

function queueGattWrite(payload) {
  const result = writeChain.then(() => {
    if (characteristic.writeValueWithoutResponse) {
      return characteristic.writeValueWithoutResponse(payload);
    }
    return characteristic.writeValue(payload); // older Chrome fallback
  });
  // Swallow here so one failed write doesn't wedge the chain for everyone
  // after it — callers still see the real error via the returned promise.
  writeChain = result.catch(() => {});
  return result;
}

async function sendText(text) {
  if (!characteristic) return;
  const { hex, payload } = textToHexAsciiPayload(text);
  try {
    await queueGattWrite(payload);
    log(`Sent: ${text}  (wire: ${hex})`, 'tx');
  } catch (err) {
    log(`Write failed: ${err}`, 'err');
    // A failed GATT write is solid proof the link is actually down, even if
    // Chrome/Android hasn't fired "gattserverdisconnected" yet (it can lag
    // or, for a silent link-supervision timeout, never fire promptly at
    // all) — without this the status badge is left stuck on "connected".
    onDisconnected();
  }
}

sendBtn.addEventListener('click', () => {
  const text = cmdEl.value;
  if (text.trim() === '') return;
  sendText(text);
  cmdEl.value = '';
});
cmdEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

document.querySelectorAll('.quickCmdBtn').forEach(btn => {
  if (!btn.dataset.cmd) return;
  btn.addEventListener('click', () => {
    if (btn.dataset.cmd === 'get all devices' || btn.dataset.cmd === 'run all devices') {
      // Fresh scan starting — show Address/Value again (in case a previous
      // scan already replaced them with a "Found N devices" line) and
      // reset them, so stale numbers from the last scan aren't mistaken
      // for live ones while this one is still running.
      loopFoundInfoEl.style.display = 'none';
      clearLoopFoundLines();
      loopFoundMoreHintEl.style.display = 'none';
      loopAddrLineEl.textContent = 'Address = —';
      loopAddrLineEl.style.display = '';
      loopValueLineEl.textContent = 'Value = —';
      loopValueLineEl.style.display = '';
      loopTransmitLineEl.textContent = 'Total transmit = —';
      loopTransmitLineEl.style.display = 'none';
      loopRecErrorLineEl.textContent = 'receive error = —';
      loopRecErrorLineEl.style.display = 'none';
      lastSameAddress = null;
      lastLedAddress = null;
    }
    sendText(btn.dataset.cmd);
  });
});

// "change addr" — firmware's CommandParser expects "ch addr" directly
// followed by 1-3 decimal digits, e.g. "ch addr5" or "ch addr123"
// (see parse_decimal() call in Prog7000_App.c). Each tap opens a prompt
// pre-filled with (last address actually sent) + 1, so repeatedly tapping
// "OK" walks the address up by one each time; the value can still be
// edited freely before sending.
chAddrBtn.addEventListener('click', () => {
  const defaultVal = (lastChAddr === null) ? '1' : String(lastChAddr + 1);
  const input = window.prompt('New address (1-3 digits):', defaultVal);
  if (input === null) return; // cancelled

  const trimmed = input.trim();
  if (!/^\d{1,3}$/.test(trimmed)) {
    log(`"${input}" is not 1-3 digits — not sent.`, 'err');
    return;
  }

  lastChAddr = parseInt(trimmed, 10);
  sendText('ch addr' + trimmed);
});

// ---- Keepalive ----

function startKeepalive() {
  keepaliveEnabled = true;
  keepaliveBtn.textContent = 'Keepalive: on';
  keepaliveBtn.classList.remove('paused');
  stopKeepaliveTimer();
  keepaliveTimer = setInterval(async () => {
    if (!keepaliveEnabled || !characteristic) return;
    const { payload } = textToHexAsciiPayload(KEEPALIVE_TEXT);
    try {
      await queueGattWrite(payload);
    } catch (err) {
      log(`[Keepalive] write failed — link is down: ${err}`, 'err');
      // Same reasoning as in sendText()'s catch — a write failure is the
      // most reliable signal we get that the connection is actually gone.
      onDisconnected();
    }
  }, KEEPALIVE_INTERVAL_MS);
}

function stopKeepaliveTimer() {
  if (keepaliveTimer) {
    clearInterval(keepaliveTimer);
    keepaliveTimer = null;
  }
}

keepaliveBtn.addEventListener('click', () => {
  keepaliveEnabled = !keepaliveEnabled;
  keepaliveBtn.textContent = keepaliveEnabled ? 'Keepalive: on' : 'Keepalive: paused';
  keepaliveBtn.classList.toggle('paused', !keepaliveEnabled);
  log(keepaliveEnabled ? '[Keepalive] resumed' : '[Keepalive] paused', 'sys');
});

connectBtn.addEventListener('click', connect);
disconnectBtn.addEventListener('click', disconnect);

// While the screen is off / the tab is backgrounded, mobile Chrome freezes
// timers — the keepalive interval doesn't run at all, so a link that dies
// during that time goes unnoticed until the next scheduled tick fires
// (which can lag well past KEEPALIVE_INTERVAL_MS once resumed). Force an
// immediate write the moment the page becomes visible again instead of
// waiting for that tick, so the status badge catches up right away.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !characteristic) return;
  if (!wakeLock) acquireWakeLock(); // the lock is auto-released whenever the tab was hidden
  const { payload } = textToHexAsciiPayload(KEEPALIVE_TEXT);
  queueGattWrite(payload).catch((err) => {
    log(`[Keepalive] write failed after resume — link is down: ${err}`, 'err');
    onDisconnected();
  });
});

setConnectedUI(false);
showView('home');
log('Tap "Connect" to scan for PROG7000.', 'sys');
</script>
